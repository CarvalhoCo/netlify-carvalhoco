[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/functions/produtos-teste.json", "public/index.html"]

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[redirects]]
  from = "/api/precos"
  to = "/.netlify/functions/buscar-precos"
  status = 200

[[redirects]]
  from = "/api/horarios"
  to = "/.netlify/functions/horarios-publicos"
  status = 200

[[redirects]]
  from = "/api/admin/horarios"
  to = "/.netlify/functions/horarios-admin"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/pagina-inicial"
  status = 200
  force = true
