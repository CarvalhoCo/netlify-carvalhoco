<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carvalho&Co.</title>
    <link
      rel="preload"
      href="./fontes/control-upright-regular-tnt.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="modulepreload" href="./app.js" />
    <style>
      @font-face {
        font-family: "Control Upright";
        src: url("./fontes/control-upright-regular-tnt.woff2") format("woff2");
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }

      .pagina-inicial {
        margin: 0;
        background-color: #111111;
        color: #eeeeee;
        line-height: 1;
        font-family: "Control Upright", sans-serif;
        font-feature-settings: "ss04" 1;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .principal-inicial {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
      }

      .conteudo-inicial {
        width: 100%;
        max-width: 768px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .cartao-inicial {
        width: 100%;
        border: 1px solid #343434;
        border-radius: 0;
        background-color: #1a1a1a;
        box-sizing: border-box;
        padding: 16px;
      }

      .linha-cabecalho-inicial {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .marca-inicial,
      .relogio-inicial {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        color: #eeeeee;
      }

      .relogio-inicial {
        text-align: right;
      }

      .cartao-contagem-inicial {
        text-align: center;
      }

      .titulo-contagem-inicial,
      .status-contagem-inicial {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        color: #eeeeee;
      }

      .valor-contagem-inicial {
        margin: 16px 0 0;
        font-size: clamp(2.2rem, 8vw, 3rem);
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #eeeeee;
        line-height: 1;
      }

      .status-contagem-inicial {
        margin-top: 16px;
      }

      .conteudo-acao-inicial {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .titulo-acao-inicial {
        margin: 0;
        width: 100%;
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        color: #eeeeee;
      }

      .botao-primario {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        font-size: 20px;
        border: 1px solid #343434;
        border-radius: 0;
        background-color: #eeeeee;
        color: #111111;
        font-weight: 600;
        text-decoration: none;
        text-transform: uppercase;
      }
    </style>
    <link rel="preload" href="./styles.css" as="style" />
    <link rel="stylesheet" href="./styles.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="./styles.css" /></noscript>
  </head>
  <body class="pagina-inicial">
    <main class="principal-inicial">
      <section class="conteudo-inicial">
        <div class="cartao-inicial">
          <div class="linha-cabecalho-inicial">
            <p class="marca-inicial">Carvalho&Co.</p>
            <p id="hora-brasilia" class="relogio-inicial">--:--:--</p>
          </div>
        </div>

        <div class="cartao-inicial cartao-contagem-inicial">
          <p id="contador-detalhe-titulo" class="titulo-contagem-inicial"></p>
          <p id="contador-detalhe-valor" class="valor-contagem-inicial"></p>
          <p id="contador-status" class="status-contagem-inicial"></p>
        </div>

        <div class="cartao-inicial">
          <div class="conteudo-acao-inicial">
            <p class="titulo-acao-inicial">Alguma duvida sobre<br>nossos preços?</p>
            <a href="./busca.html" class="botao-primario">Clique aqui</a>
          </div>
        </div>

        <div class="cartao-inicial">
          <div class="conteudo-acao-inicial">
            <p class="titulo-acao-inicial">Quer saber como<br>chegar até nós?</p>
            <a
              href="https://maps.app.goo.gl/53wnFwKywyg69iVP7"
              target="_blank"
              rel="noopener noreferrer"
              class="botao-primario"
            >
              Abrir Google Maps
            </a>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
