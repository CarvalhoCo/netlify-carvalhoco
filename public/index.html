<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carvalho&Co.</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="pagina-inicial">
    <main class="principal-inicial">
      <section class="conteudo-inicial">
        <div class="cartao-inicial">
          <div class="linha-cabecalho-inicial">
            <p class="marca-inicial">Carvalho&Co.</p>
            <p id="hora-brasilia" class="relogio-inicial">--:--:--</p>
          </div>
        </div>

        <div class="cartao-inicial cartao-contagem-inicial">
          <p id="contador-detalhe-titulo" class="titulo-contagem-inicial"></p>
          <p id="contador-detalhe-valor" class="valor-contagem-inicial"></p>
          <p id="contador-status" class="status-contagem-inicial"></p>
        </div>

        <div class="cartao-inicial">
          <div class="conteudo-acao-inicial">
            <p class="titulo-acao-inicial">Alguma duvida sobre nossos preços?</p>
            <a href="./busca.html" class="botao-primario">Clique aqui</a>
          </div>
        </div>

        <div class="cartao-inicial">
          <div class="conteudo-acao-inicial">
            <p class="titulo-acao-inicial">Quer saber como chegar até nós?</p>
            <a
              href="https://maps.app.goo.gl/53wnFwKywyg69iVP7"
              target="_blank"
              rel="noopener noreferrer"
              class="botao-primario"
            >
              Abrir no Google Maps
            </a>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
