<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulta de preços | Carvalho&amp;Co.</title>
    <meta
      name="description"
      content="Consulte preços de bebidas e encontre seus produtos favoritos na Adega Carvalho, Carvalho&amp;Co. em Mauá."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://adegacarvalho.com/busca" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Carvalho&amp;Co." />
    <meta property="og:title" content="Consulta de preços | Carvalho&amp;Co." />
    <meta
      property="og:description"
      content="Consulte preços de bebidas e encontre seus produtos favoritos na Adega Carvalho, Carvalho&amp;Co. em Mauá."
    />
    <meta property="og:url" content="https://adegacarvalho.com/busca" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Consulta de preços | Carvalho&amp;Co." />
    <meta
      name="twitter:description"
      content="Consulte preços de bebidas e encontre seus produtos favoritos na Adega Carvalho, Carvalho&amp;Co. em Mauá."
    />
    <link rel="modulepreload" href="./app.js" />
    <style>
      .pagina-busca {
        margin: 0;
        background-color: #111111;
        color: #eeeeee;
        font-family: "IBM Plex Mono", monospace;
        font-weight: 500;
        font-feature-settings: "ss04" 1;
      }

      .principal-busca {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
      }

      .conteudo-busca {
        width: 100%;
        max-width: 768px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .cartao-inicial {
        width: 100%;
        border: 1px solid #343434;
        border-radius: 0;
        background-color: #1a1a1a;
        box-sizing: border-box;
        padding: 16px;
      }

      .painel-busca {
        width: 100%;
        box-sizing: border-box;
      }

      .area-campo-busca {
        position: relative;
      }

      .area-icone-busca {
        pointer-events: none;
        position: absolute;
        top: 0;
        bottom: 0;
        left: 12px;
        display: flex;
        align-items: center;
      }

      .icone-busca {
        width: 16px;
        height: 16px;
        color: #eeeeee;
      }

      .entrada-busca {
        width: 100%;
        border: 1px solid #343434;
        border-radius: 0;
        background-color: #1a1a1a;
        color: #eeeeee;
        padding: 16px 96px 16px 40px;
        font-size: 14px;
        box-sizing: border-box;
      }

      .entrada-busca::-webkit-search-cancel-button {
        -webkit-appearance: none;
        appearance: none;
        display: none;
      }

      .entrada-busca::placeholder {
        color: #eeeeee;
        opacity: 0.45;
      }

      .entrada-busca:focus::placeholder {
        opacity: 0;
      }

      .botao-secundario {
        border: 1px solid #343434;
        border-radius: 0;
        background-color: #eeeeee;
        color: #111111;
        font-weight: 600;
        text-decoration: none;
      }

      .botao-secundario--pequeno {
        padding: 8px 16px;
        font-size: 14px;
      }

      .botao-voltar-busca {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        border: 1px solid #343434;
        background-color: #1a1a1a;
        color: #eeeeee;
        text-decoration: none;
      }

      .botao-busca-acao {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
      }

      .lista-resultados-busca {
        list-style: none;
        margin: 0;
        padding: 0;
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #343434;
        border-top: 0;
        background-color: #1a1a1a;
      }

      .mensagem-resultados-busca {
        padding: 16px;
        font-size: 14px;
        color: #eeeeee;
        text-align: center;
      }

      @media (min-width: 768px) {
        .principal-busca {
          align-items: center;
        }
      }
    </style>
    <link rel="preload" href="./styles.css" as="style" />
    <link rel="stylesheet" href="./styles.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="./styles.css" /></noscript>
  </head>
  <body class="pagina-busca">
    <main class="principal-busca">
      <section class="conteudo-busca">
        <a href="/" class="botao-voltar-busca botao-secundario--pequeno">Voltar</a>

        <div id="campo-busca" class="painel-busca">
          <form class="formulario-busca">
            <label for="busca" class="apenas-leitor-tela">Buscar produto</label>
            <div class="area-campo-busca">
              <div class="area-icone-busca">
                <svg
                  class="icone-busca"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 20 20"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"
                  />
                </svg>
              </div>
              <input
                id="busca"
                class="entrada-busca"
                type="search"
                placeholder="Exemplo: Skol lata"
                autocomplete="off"
                aria-autocomplete="list"
                aria-expanded="false"
                aria-controls="lista-resultados"
              />
              <button id="botao-busca" type="submit" class="botao-busca-acao botao-secundario botao-secundario--pequeno">
                Buscar
              </button>
            </div>
          </form>

          <ul id="lista-resultados" class="lista-resultados-busca" role="listbox">
            <li class="mensagem-resultados-busca">Digite o nome do produto acima</li>
          </ul>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
