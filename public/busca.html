<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carvalho&Co.</title>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />
    <style>
      html,
      body,
      body * {
        line-height: 1;
        border-radius: 0 !important;
      }

      .text-xl {
        font-size: 19px !important;
      }

      input[type="search"]::-webkit-search-cancel-button {
        -webkit-appearance: none;
        appearance: none;
        display: none;
      }
    </style>
  </head>
  <body style="background-color: #111111; color: #EEEEEE">
    <main class="flex min-h-screen justify-center p-4 md:items-center">
      <section class="w-full max-w-3xl space-y-6">
        <div
          class="w-full border p-4"
          style="border-color: #343434; background-color: #1A1A1A"
        >
          <div class="flex items-center justify-between gap-4">
            <p class="text-base font-semibold" style="color: #EEEEEE">Carvalho&Co.</p>
            <p id="hora-brasilia" class="text-base font-semibold text-right" style="color: #EEEEEE">
              --:--:--
            </p>
          </div>
        </div>

        <div id="campo-busca">
          <form class="w-full">
            <label for="busca" class="sr-only">Buscar produto</label>
            <div class="relative">
              <div class="pointer-events-none absolute inset-y-0 start-0 flex items-center ps-3">
                <svg
                  class="h-4 w-4"
                  style="color: #EEEEEE"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 20 20"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"
                  />
                </svg>
              </div>
              <input
                id="busca"
                class="block w-full border bg-gray-800 p-4 ps-10 pe-24 text-sm focus:border-[#343434] focus:ring-[#343434]"
                style="color: #EEEEEE; border-color: #343434; background-color: #1A1A1A"
                type="search"
                autocomplete="off"
                aria-autocomplete="list"
                aria-expanded="false"
                aria-controls="lista-resultados"
              />
              <button
                id="botao-busca"
                type="submit"
                class="absolute end-2.5 top-1/2 -translate-y-1/2 border px-4 py-2 text-sm font-medium transition-colors hover:bg-gray-200 focus:outline-none focus:ring-4 focus:ring-gray-600"
                style="background-color: #EEEEEE; border-color: #343434; color: #111111"
              >
                Buscar
              </button>
            </div>
          </form>

          <ul
            id="lista-resultados"
            class="hidden w-full border border-t-0 bg-gray-800"
            style="border-color: #343434; background-color: #1A1A1A"
            role="listbox"
          ></ul>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
