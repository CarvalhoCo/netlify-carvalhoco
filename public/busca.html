<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carvalho&Co.</title>
    <link
      rel="preload"
      href="./fontes/control-upright-regular-tnt.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="modulepreload" href="./app.js" />
    <style>
      @font-face {
        font-family: "Control Upright";
        src: url("./fontes/control-upright-regular-tnt.woff2") format("woff2");
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }

      .pagina-busca {
        margin: 0;
        background-color: #111111;
        color: #eeeeee;
        line-height: 1;
        font-family: "Control Upright", sans-serif;
        font-feature-settings: "ss04" 1;
        letter-spacing: 0.12em;
      }

      .principal-busca {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
      }

      .conteudo-busca {
        width: 100%;
        max-width: 768px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .cartao-inicial,
      .cartao-busca {
        width: 100%;
        border: 1px solid #343434;
        border-radius: 0;
        background-color: #1a1a1a;
        box-sizing: border-box;
        padding: 16px;
      }

      .linha-cabecalho-busca {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .marca-busca,
      .relogio-busca {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        color: #eeeeee;
      }

      .relogio-busca {
        text-align: right;
      }

      .painel-busca {
        width: 100%;
        box-sizing: border-box;
      }

      .area-campo-busca {
        position: relative;
      }

      .area-icone-busca {
        pointer-events: none;
        position: absolute;
        top: 0;
        bottom: 0;
        left: 12px;
        display: flex;
        align-items: center;
      }

      .icone-busca {
        width: 16px;
        height: 16px;
        color: #eeeeee;
      }

      .entrada-busca {
        width: 100%;
        border: 1px solid #343434;
        border-radius: 0;
        background-color: #1a1a1a;
        color: #eeeeee;
        padding: 16px 96px 16px 40px;
        font-size: 14px;
        box-sizing: border-box;
      }

      .entrada-busca::-webkit-search-cancel-button {
        -webkit-appearance: none;
        appearance: none;
        display: none;
      }

      .botao-secundario {
        border: 1px solid #343434;
        border-radius: 0;
        background-color: #eeeeee;
        color: #111111;
        font-weight: 600;
        text-decoration: none;
        text-transform: uppercase;
      }

      .botao-secundario--pequeno {
        padding: 8px 16px;
        font-size: 14px;
      }

      .botao-busca-acao {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
      }

      .lista-resultados-busca {
        list-style: none;
        margin: 0;
        padding: 0;
        width: 100%;
        border: 1px solid #343434;
        border-top: 0;
        background-color: #1a1a1a;
      }

      .mensagem-resultados-busca {
        padding: 10px 16px;
        font-size: 14px;
        color: #eeeeee;
      }

      @media (min-width: 768px) {
        .principal-busca {
          align-items: center;
        }
      }
    </style>
    <link rel="preload" href="./styles.css" as="style" />
    <link rel="stylesheet" href="./styles.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="./styles.css" /></noscript>
  </head>
  <body class="pagina-busca">
    <main class="principal-busca">
      <section class="conteudo-busca">
        <div class="cartao-inicial cartao-busca">
          <div class="linha-cabecalho-busca">
            <p class="marca-busca">Carvalho&Co.</p>
            <p id="hora-brasilia" class="relogio-busca">--:--:--</p>
          </div>
        </div>

        <div id="campo-busca" class="painel-busca">
          <form class="formulario-busca">
            <label for="busca" class="apenas-leitor-tela">Buscar produto</label>
            <div class="area-campo-busca">
              <div class="area-icone-busca">
                <svg
                  class="icone-busca"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 20 20"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"
                  />
                </svg>
              </div>
              <input
                id="busca"
                class="entrada-busca"
                type="search"
                autocomplete="off"
                aria-autocomplete="list"
                aria-expanded="false"
                aria-controls="lista-resultados"
              />
              <button id="botao-busca" type="submit" class="botao-busca-acao botao-secundario botao-secundario--pequeno">
                Buscar
              </button>
            </div>
          </form>

          <ul id="lista-resultados" class="lista-resultados-busca" role="listbox">
            <li class="mensagem-resultados-busca">Digite pelo menos 2 caracteres.</li>
          </ul>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
