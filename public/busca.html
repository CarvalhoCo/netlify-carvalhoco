<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carvalho&Co.</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="pagina-busca">
    <main class="principal-busca">
      <section class="conteudo-busca">
        <div class="cartao-busca">
          <div class="linha-cabecalho-busca">
            <p class="marca-busca">Carvalho&Co.</p>
            <p id="hora-brasilia" class="relogio-busca">--:--:--</p>
          </div>
        </div>

        <div id="campo-busca" class="painel-busca">
          <form class="formulario-busca">
            <label for="busca" class="apenas-leitor-tela">Buscar produto</label>
            <div class="area-campo-busca">
              <div class="area-icone-busca">
                <svg
                  class="icone-busca"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 20 20"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"
                  />
                </svg>
              </div>
              <input
                id="busca"
                class="entrada-busca"
                type="search"
                autocomplete="off"
                aria-autocomplete="list"
                aria-expanded="false"
                aria-controls="lista-resultados"
              />
              <button id="botao-busca" type="submit" class="botao-busca-acao botao-secundario botao-secundario--pequeno">
                Buscar
              </button>
            </div>
          </form>

          <ul id="lista-resultados" class="lista-resultados-busca oculto" role="listbox"></ul>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
