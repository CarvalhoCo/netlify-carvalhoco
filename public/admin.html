<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carvalho&Co. - Admin</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="pagina-administracao">
    <main class="principal-administracao">
      <section class="cartao-administracao">
        <h1 class="titulo-administracao">Painel de Administracao - Horarios</h1>
        <p class="subtitulo-administracao">
          Acesse esta pagina apenas por URL. Use sua senha para editar horarios semanais e por data.
        </p>
      </section>

      <section id="bloco-login" class="cartao-administracao">
        <label for="senha-administracao" class="rotulo-administracao">Senha da administracao</label>
        <div class="linha-login-administracao">
          <input
            id="senha-administracao"
            type="password"
            class="entrada-administracao"
            autocomplete="current-password"
          />
          <button id="btn-entrar" type="button" class="botao-secundario">
            Entrar
          </button>
        </div>
        <p id="status-login" class="status-administracao"></p>
      </section>

      <section id="bloco-administracao" class="cartao-administracao oculto">
        <div class="cabecalho-painel-administracao">
          <p id="status-modo" class="modo-administracao"></p>
          <button id="btn-sair" type="button" class="botao-secundario botao-secundario--pequeno">
            Sair
          </button>
        </div>

        <div class="area-tabela-administracao">
          <table class="tabela-administracao">
            <thead class="cabecalho-tabela-administracao">
              <tr>
                <th class="titulo-coluna-administracao">Dia</th>
                <th class="titulo-coluna-administracao">Fechado</th>
                <th class="titulo-coluna-administracao">Abre</th>
                <th class="titulo-coluna-administracao">Fecha</th>
              </tr>
            </thead>
            <tbody id="tabela-semana"></tbody>
          </table>
        </div>

        <div class="cartao-interno-administracao">
          <h2 class="titulo-secao-administracao">Sobrescritas por data</h2>
          <p class="descricao-secao-administracao">
            Use para alterar horario em uma data especifica ou fechar totalmente a loja naquele dia.
          </p>

          <div class="area-tabela-administracao">
            <table class="tabela-administracao tabela-administracao--sobrescritas">
              <thead class="cabecalho-tabela-administracao cabecalho-tabela-administracao--alternativo">
                <tr>
                  <th class="titulo-coluna-administracao">Data</th>
                  <th class="titulo-coluna-administracao">Fechado</th>
                  <th class="titulo-coluna-administracao">Abre</th>
                  <th class="titulo-coluna-administracao">Fecha</th>
                  <th class="titulo-coluna-administracao">Acao</th>
                </tr>
              </thead>
              <tbody id="lista-sobrescritas"></tbody>
            </table>
          </div>

          <button id="btn-adicionar-data" type="button" class="botao-secundario botao-secundario--pequeno">
            Adicionar data
          </button>
        </div>

        <div class="linha-acoes-administracao">
          <button id="btn-salvar" type="button" class="botao-secundario">
            Salvar horarios
          </button>
          <p id="status-salvar" class="status-salvar-administracao status-salvar-administracao--alinhado"></p>
        </div>
      </section>
    </main>

    <script type="module" src="./admin.js"></script>
  </body>
</html>
