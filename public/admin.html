<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carvalho&Co. - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />
    <style>
      html,
      body,
      body * {
        line-height: 1;
        border-radius: 0 !important;
      }

      .text-xl {
        font-size: 19px !important;
      }

      input[type="search"]::-webkit-search-cancel-button {
        -webkit-appearance: none;
        appearance: none;
        display: none;
      }
    </style>
  </head>
  <body style="background-color: #111111; color: #eeeeee">
    <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-4 p-4">
      <section class="w-full border p-4" style="border-color: #343434; background-color: #1a1a1a">
        <h1 class="text-xl font-bold" style="color: #eeeeee">Painel Admin - Horarios</h1>
        <p class="mt-2 text-sm" style="color: #eeeeee">
          Acesse esta pagina apenas por URL. Use sua senha para editar horarios semanais e por data.
        </p>
      </section>

      <section id="bloco-login" class="w-full border p-4" style="border-color: #343434; background-color: #1a1a1a">
        <label for="senha-admin" class="text-sm font-semibold" style="color: #eeeeee">Senha do admin</label>
        <div class="mt-3 flex flex-col gap-2 sm:flex-row">
          <input
            id="senha-admin"
            type="password"
            class="w-full border p-3 text-sm focus:border-[#343434] focus:ring-[#343434]"
            style="color: #eeeeee; border-color: #343434; background-color: #111111"
            autocomplete="current-password"
          />
          <button
            id="btn-entrar"
            type="button"
            class="inline-flex items-center justify-center border px-6 py-3 text-base font-semibold transition-colors hover:bg-gray-200 focus:outline-none focus:ring-4 focus:ring-gray-600"
            style="background-color: #eeeeee; border-color: #343434; color: #111111"
          >
            Entrar
          </button>
        </div>
        <p id="status-login" class="mt-3 text-sm" style="color: #eeeeee"></p>
      </section>

      <section
        id="bloco-admin"
        class="hidden w-full border p-4"
        style="border-color: #343434; background-color: #1a1a1a"
      >
        <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <p id="status-modo" class="text-sm font-semibold" style="color: #eeeeee"></p>
          <button
            id="btn-sair"
            type="button"
            class="inline-flex items-center justify-center border px-4 py-2 text-sm font-semibold transition-colors hover:bg-gray-200 focus:outline-none focus:ring-4 focus:ring-gray-600"
            style="background-color: #eeeeee; border-color: #343434; color: #111111"
          >
            Sair
          </button>
        </div>

        <div class="mt-4 overflow-x-auto border" style="border-color: #343434">
          <table class="w-full min-w-[720px] text-left text-sm" style="color: #eeeeee">
            <thead style="background-color: #111111">
              <tr>
                <th class="border px-3 py-2" style="border-color: #343434">Dia</th>
                <th class="border px-3 py-2" style="border-color: #343434">Fechado</th>
                <th class="border px-3 py-2" style="border-color: #343434">Abre</th>
                <th class="border px-3 py-2" style="border-color: #343434">Fecha</th>
              </tr>
            </thead>
            <tbody id="tabela-semana"></tbody>
          </table>
        </div>

        <div class="mt-4 border p-4" style="border-color: #343434; background-color: #111111">
          <h2 class="text-xl font-semibold" style="color: #eeeeee">Sobrescritas por data</h2>
          <p class="mt-2 text-sm" style="color: #eeeeee">
            Use para alterar horario em uma data especifica ou fechar totalmente a loja naquele dia.
          </p>

          <div class="mt-4 overflow-x-auto border" style="border-color: #343434">
            <table class="w-full min-w-[800px] text-left text-sm" style="color: #eeeeee">
              <thead style="background-color: #1a1a1a">
                <tr>
                  <th class="border px-3 py-2" style="border-color: #343434">Data</th>
                  <th class="border px-3 py-2" style="border-color: #343434">Fechado</th>
                  <th class="border px-3 py-2" style="border-color: #343434">Abre</th>
                  <th class="border px-3 py-2" style="border-color: #343434">Fecha</th>
                  <th class="border px-3 py-2" style="border-color: #343434">Acao</th>
                </tr>
              </thead>
              <tbody id="lista-sobrescritas"></tbody>
            </table>
          </div>

          <button
            id="btn-adicionar-data"
            type="button"
            class="mt-3 inline-flex items-center justify-center border px-4 py-2 text-sm font-semibold transition-colors hover:bg-gray-200 focus:outline-none focus:ring-4 focus:ring-gray-600"
            style="background-color: #eeeeee; border-color: #343434; color: #111111"
          >
            Adicionar data
          </button>
        </div>

        <div class="mt-4 flex flex-col gap-2 sm:flex-row">
          <button
            id="btn-salvar"
            type="button"
            class="inline-flex items-center justify-center border px-6 py-3 text-base font-semibold transition-colors hover:bg-gray-200 focus:outline-none focus:ring-4 focus:ring-gray-600"
            style="background-color: #eeeeee; border-color: #343434; color: #111111"
          >
            Salvar horarios
          </button>
          <p id="status-salvar" class="self-center text-sm" style="color: #eeeeee"></p>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
    <script type="module" src="./admin.js"></script>
  </body>
</html>
